<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4. 시각화</title>
</head>
<body>
  <h1>4. 시각화</h1>

  {% if domain_stats %}
    <form action="{{ url_for('run_visualize') }}" method="post">
      <button type="submit">차트 생성</button>
    </form>
  {% else %}
    <p>3단계 통계 데이터가 없습니다.</p>
  {% endif %}

  {% if domain_chart %}
    <img src="{{ url_for('static', filename=domain_chart) }}" alt=".kr/.net 차트">
  {% else %}
    <p>.kr / .net 차트 이미지가 없습니다.</p>
  {% endif %}

  {% if protocol_chart %}
    <img src="{{ url_for('static', filename=protocol_chart) }}" alt="http/https 차트">
  {% else %}
    <p>http / https 차트 이미지가 없습니다.</p>
  {% endif %}

  <form action="{{ url_for('index') }}" method="get">
    <button type="submit">메인으로 돌아가기</button>
  </form>
</body>
</html>
