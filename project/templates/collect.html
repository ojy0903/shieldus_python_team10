<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1. 데이터 수집</title>
</head>
<body>
  <h1>1. 공공데이터 수집 → MongoDB 저장</h1>

  <form action="{{ url_for('run_collect') }}" method="post">
    <button type="submit">수집 실행</button>
  </form>

  {% if error %}
    <p>수집 실패: {{ error }}</p>
  {% endif %}

  {% if mongo_id %}
    <p>컬렉션: {{ collection_name }}</p>
    <p>몽고DB ID: {{ mongo_id }}</p>
  {% else %}
    <p>아직 수집된 데이터가 없습니다.</p>
  {% endif %}

  <form action="{{ url_for('index') }}" method="get">
    <button type="submit">메인으로 돌아가기</button>
  </form>
</body>
</html>
